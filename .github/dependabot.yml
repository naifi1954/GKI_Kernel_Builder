version: 2
updates:
  # Scan .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # Composite actions punya action.yml sendiri-sendiri, gak ke-scan
  # otomatis lewat directory "/" di atas, jadi harus didaftar manual.
  - package-ecosystem: "github-actions"
    directory: "/.github/actions/bbg"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
